<svg width="128" height="128" viewBox="0 0 128 128"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect x="0" y="0" width="128" height="128" fill="rgba(245, 245, 245, 0)"/>

  <!-- Bottom half of Z Flip 5 -->
  <rect x="30" y="64" width="50" height="55" rx="8" ry="8"
        fill="#ffd84a" stroke="#c9a533" stroke-width="2"/>



  <!-- Bottom highlight -->
  <rect x="32" y="66" width="46" height="10" rx="6" ry="6"
        fill="#ffe98a" opacity="0.7"/>

  <!-- Top half of Z Flip 5 (slightly open) -->

    <!-- Top body -->
    <rect x="30" y="20" width="50" height="50" rx="8" ry="8"
          fill="#141412ff" stroke="#c9a533" stroke-width="2"/>

    <!-- Outer cover screen -->

    <!-- Camera lenses -->
    <circle cx="45" cy="28" r="3.2" fill="#5e5c5cff"/>
    <circle cx="37" cy="28" r="3.2" fill="#5e5c5cff"/>

    <!-- Camera lens highlights -->
    <circle cx="15.2" cy="-28.8" r="1.1" fill="#ffffff" opacity="0.7"/>
    <circle cx="23.2" cy="-28.8" r="1.1" fill="#ffffff" opacity="0.7"/>

    <!-- Small flash -->
    <rect x="28.5" y="-29.5" width="4.5" height="3"
          rx="1" ry="1" fill="#fdf6c3"/>

    <!-- Subtle reflection on cover screen -->
    <path d="M -26 -32 L -10 -32 L -26 -22 Z"
          fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- Hinge area -->
  <rect x="30" y="65" width="50" height="6"
        rx="3" ry="3" fill="#e0c24a" stroke="#b79a33" stroke-width="1"/>


  <!-- Subtle shadow under phone -->

</svg>
