<svg
  width="128"
  height="128"
  viewBox="0 0 128 128"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Background (transparent) -->
  <rect width="128" height="128" fill="none"/>

  <!-- Matte silver gradient -->
  <defs>
    <linearGradient id="lidGradient" x1="0" y1="20" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E4"/>
      <stop offset="50%" stop-color="#D3D3D3"/>
      <stop offset="100%" stop-color="#C0C0C0"/>
    </linearGradient>
  </defs>

  <!-- Laptop lid (slightly curved edges) -->
  <rect
    x="10"
    y="20"
    width="108"
    height="72"
    rx="8"
    ry="8"
    fill="url(#lidGradient)"
  />

  <!-- Front hinge strip -->
  <rect
    x="10"
    y="88"
    width="108"
    height="6"
    rx="3"
    ry="3"
    fill="#A8A8A8"
  />

  <!-- Notch -->
  <rect
    x="59"
    y="88"
    width="10"
    height="6"
    rx="3"
    ry="3"
    fill="#7A7A7A"
  />

  <!-- Heart sticker (small, slightly above notch) -->
  <path
    d="M64 70
       C 59 64, 52 66, 52 72
       C 52 78, 58 82, 64 88
       C 70 82, 76 78, 76 72
       C 76 66, 69 64, 64 70 Z"
    fill="#E53935"
  />

  <!-- EICS text inside heart -->
  <text
    x="64"
    y="76"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="7"
    font-weight="700"
    fill="#FFFFFF"
  >
    EICS
  </text>

</svg>
